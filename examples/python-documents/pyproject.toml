[project]
name = "agentplug-example-python-documents"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["agent-platform-sdk==2.1.0", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["document_assistant*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = [".", "../../sdk/python"]
asyncio_default_fixture_loop_scope = "function"
