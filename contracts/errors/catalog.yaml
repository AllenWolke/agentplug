version: agent-errors/v1
errors:
  - {code: INVALID_REQUEST, http_status: 400, grpc_status: INVALID_ARGUMENT, retryable: false}
  - {code: UNAUTHENTICATED, http_status: 401, grpc_status: UNAUTHENTICATED, retryable: false}
  - {code: PERMISSION_DENIED, http_status: 403, grpc_status: PERMISSION_DENIED, retryable: false}
  - {code: RESOURCE_NOT_FOUND, http_status: 404, grpc_status: NOT_FOUND, retryable: false}
  - {code: IDEMPOTENCY_CONFLICT, http_status: 409, grpc_status: ALREADY_EXISTS, retryable: false}
  - {code: REVISION_CONFLICT, http_status: 409, grpc_status: ABORTED, retryable: true}
  - {code: PROTOCOL_NOT_SUPPORTED, http_status: 426, grpc_status: FAILED_PRECONDITION, retryable: false}
  - {code: SCHEMA_VALIDATION_FAILED, http_status: 422, grpc_status: INVALID_ARGUMENT, retryable: false}
  - {code: AUTHORIZATION_REVOKED, http_status: 403, grpc_status: PERMISSION_DENIED, retryable: false}
  - {code: RUN_NOT_RECOVERABLE, http_status: 409, grpc_status: FAILED_PRECONDITION, retryable: false}
  - {code: CAPACITY_EXHAUSTED, http_status: 429, grpc_status: RESOURCE_EXHAUSTED, retryable: true}
  - {code: UPSTREAM_TIMEOUT, http_status: 504, grpc_status: DEADLINE_EXCEEDED, retryable: true}
  # A malformed response may follow a committed effect; never retry blindly.
  # 坏响应可能发生在副作用提交之后，不允许盲目重试。
  - {code: UPSTREAM_PROTOCOL_ERROR, http_status: 502, grpc_status: DATA_LOSS, retryable: false}
  - {code: RULE_BUNDLE_INVALID, http_status: 422, grpc_status: INVALID_ARGUMENT, retryable: false}
  - {code: RULE_BUNDLE_EMPTY, http_status: 422, grpc_status: INVALID_ARGUMENT, retryable: false}
  - {code: NO_APPLICABLE_RULE_RESULTS, http_status: 422, grpc_status: INVALID_ARGUMENT, retryable: false}
  - {code: UNSUPPORTED_REPORT_TYPE, http_status: 422, grpc_status: INVALID_ARGUMENT, retryable: false}
  - {code: REPORT_BATCH_NOT_FOUND, http_status: 422, grpc_status: INVALID_ARGUMENT, retryable: false}
  - {code: DATA_READINESS_FAILED, http_status: 422, grpc_status: FAILED_PRECONDITION, retryable: false}
  - {code: POLICY_DENIED, http_status: 403, grpc_status: PERMISSION_DENIED, retryable: false}
  - {code: CAPABILITY_UNAVAILABLE, http_status: 503, grpc_status: UNAVAILABLE, retryable: true}
  - {code: INTERNAL_ERROR, http_status: 500, grpc_status: INTERNAL, retryable: false}
