name: agentplug

# Platform, frontend and isolated common-capability workers.
# SDK examples follow verification of the common capability layer.

services:
  platform-app:
    image: agentplug:platform
    profiles: ["modular", "full"]
    build: &platform-build
      context: .
      dockerfile: platform/Dockerfile
    environment: &platform-runtime-environment
      APP_ENV: ${APP_ENV:-development}
      # Local demo identities are seeded only in explicit development mode;
      # platform startup rejects this switch for production environments.
      # 仅开发模式写入演示身份；生产环境开启该开关会被启动校验拒绝。
      PLATFORM_DEMO_IDENTITY_BOOTSTRAP: ${PLATFORM_DEMO_IDENTITY_BOOTSTRAP:-true}
      # Optional controller-only process-exit attestations; never grant this key to Agents.
      PLATFORM_EXECUTION_STOP_RECEIPT_DIR: ${PLATFORM_EXECUTION_STOP_RECEIPT_DIR:-}
      PLATFORM_EXECUTION_STOP_RECEIPT_KEY_FILE: ${PLATFORM_EXECUTION_STOP_RECEIPT_KEY_FILE:-}
      # Only newly approved v2 requests enter the durable erasure queue.
      # Disable during restoration until post-backup holds/deletions are reconciled.
      PLATFORM_CONVERSATION_ERASURE_ENABLED: ${PLATFORM_CONVERSATION_ERASURE_ENABLED:-true}
      PLATFORM_HTTP_ADDR: :8080
      PLATFORM_INTERNAL_ADDR: :8081
      DB_DRIVER: ${DB_DRIVER:-pgx}
      DB_DSN: ${PLATFORM_DB_DSN:-postgresql://platform_runtime:${PLATFORM_RUNTIME_DB_PASSWORD:?set random PLATFORM_RUNTIME_DB_PASSWORD}@postgres:5432/agentplug?sslmode=disable}
      INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      INTERNAL_SIGNING_SECRET_FILE: /run/secrets/internal_signing_secret
      # The non-file values are required by the non-root platform process in
      # this local Compose profile; production may replace them with readable
      # Secret Manager mounts.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
      BROWSER_GATEWAY_TOKEN: ${BROWSER_GATEWAY_TOKEN:?set independent BROWSER_GATEWAY_TOKEN}
      INTERNAL_SIGNING_SECRET: ${INTERNAL_SIGNING_SECRET:?set INTERNAL_SIGNING_SECRET}
      PLATFORM_METRIC_RUNNER_URL: http://metric-runner:8085
      PLATFORM_METRIC_RUNNER_TOKEN: ${METRIC_RUNNER_TOKEN:-${INTERNAL_TOKEN:?set INTERNAL_TOKEN}}
      PLATFORM_METRIC_RUNNER_TIMEOUT: ${PLATFORM_METRIC_RUNNER_TIMEOUT:-20s}
      PLATFORM_CONTEXT_PUBLIC_KEY: ${PLATFORM_CONTEXT_PUBLIC_KEY:?set PLATFORM_CONTEXT_PUBLIC_KEY}
      PLATFORM_CONTEXT_PRIVATE_KEY: ${PLATFORM_CONTEXT_PRIVATE_KEY:-}
      PLATFORM_CONTEXT_ISSUER: platform
      PLATFORM_CONTEXT_AUDIENCE: ${PLATFORM_CONTEXT_AUDIENCE:-agent-runtime}
      EVENT_BUS_MODE: ${PLATFORM_EVENT_BUS_MODE:-kafka}
      PLATFORM_KAFKA_BROKERS: ${PLATFORM_KAFKA_BROKERS:-kafka:9092}
      PLATFORM_KAFKA_CLIENT_ID: ${PLATFORM_KAFKA_CLIENT_ID:-lexagent-platform}
      PLATFORM_KAFKA_NOTIFICATION_TOPIC: ${PLATFORM_KAFKA_NOTIFICATION_TOPIC:-platform.audit}
      PLATFORM_KAFKA_NOTIFICATION_GROUP: ${PLATFORM_KAFKA_NOTIFICATION_GROUP:-lexagent-platform-notification-v1}
      PLATFORM_KAFKA_NOTIFICATION_DLQ: ${PLATFORM_KAFKA_NOTIFICATION_DLQ:-platform.notification-dlq.v1}
      PLATFORM_KAFKA_MAX_ATTEMPTS: ${PLATFORM_KAFKA_MAX_ATTEMPTS:-5}
      PLATFORM_KAFKA_RETRY_BACKOFF: ${PLATFORM_KAFKA_RETRY_BACKOFF:-1s}
      PLATFORM_NOTIFICATION_ADAPTER: ${PLATFORM_NOTIFICATION_ADAPTER:-audit}
      PLATFORM_NOTIFICATION_WEBHOOK_URL: ${PLATFORM_NOTIFICATION_WEBHOOK_URL:-}
      PLATFORM_RUN_EXECUTOR: ${PLATFORM_RUN_EXECUTOR:-platform}
      PLATFORM_RUN_WORKERS: ${PLATFORM_RUN_WORKERS:-4}
      PLATFORM_RUN_TREE_BUDGET_ENABLED: ${PLATFORM_RUN_TREE_BUDGET_ENABLED:-true}
      PLATFORM_LEGACY_MODEL_ACCOUNTING_RESERVATIONS: ${PLATFORM_LEGACY_MODEL_ACCOUNTING_RESERVATIONS:-}
      PLATFORM_CHILD_RUN_WORKERS: ${PLATFORM_CHILD_RUN_WORKERS:-4}
      # Provider endpoint references must resolve through this operator-owned
      # allowlist. Credentials are mounted read-only outside the image/build context.
      # Provider EndpointRef 只能通过运维维护的映射解析；密钥目录只读挂载且不进入镜像。
      PLATFORM_MODEL_ENDPOINTS_JSON: ${PLATFORM_MODEL_ENDPOINTS_JSON:-}
      PLATFORM_MODEL_SECRET_ROOT: /run/secrets/model-providers
      # Operator-owned MCP bindings; disabled when no file is selected.
      PLATFORM_MCP_BINDINGS_FILE: ${PLATFORM_MCP_BINDINGS_FILE:-}
      PLATFORM_CAPABILITY_URL: http://platform-app:8081
      # Platform-owned PostgreSQL knowledge connection; vector projection uses pgvector.
      KNOWLEDGE_DATABASE_DSN: ${KNOWLEDGE_DATABASE_DSN:-}
      PLATFORM_INDEX_WORKLOAD_SECRET_ROOT: /run/secrets/agent-workloads
      PLATFORM_POLICY_RESOLVER: ${PLATFORM_POLICY_RESOLVER:-disabled}
      PLATFORM_POLICY_BOOTSTRAP_JSON: ${PLATFORM_POLICY_BOOTSTRAP_JSON:-}
      # Published immutable Prompt bodies are injected at bootstrap. The
      # production Agent fails closed when a matching body is unavailable.
      # 发布后的不可变 Prompt 正文在启动引导时注入；生产 Agent 找不到正文会拒绝绕过。
      PLATFORM_PROMPT_TEMPLATES_JSON: ${PLATFORM_PROMPT_TEMPLATES_JSON:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    secrets:
      - internal_token
      - internal_signing_secret
    volumes:
      - type: bind
        source: ${PLATFORM_MCP_BINDINGS_DIR:-./deploy/mcp}
        target: /etc/platform/mcp
        read_only: true
      - type: bind
        source: ${PLATFORM_MODEL_SECRET_DIR:-./.local-secrets/model-providers}
        target: /run/secrets/model-providers
        read_only: true
      - type: bind
        source: ${PLATFORM_WORKLOAD_SECRET_DIR:-./.local-secrets/agent-workloads}
        target: /run/secrets/agent-workloads
        read_only: true
    ports:
      - "${PLATFORM_HOST_BIND:-127.0.0.1}:${PLATFORM_HOST_PORT:-38082}:8080"
      - "127.0.0.1:${PLATFORM_INTERNAL_HOST_PORT:-38083}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      metric-runner:
        condition: service_healthy
    networks:
      - default
      - metric-control
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: agentplug:frontend
    profiles: ["modular", "full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      LISTEN_ADDR: :80
      # The Go gateway exposes the platform registry through same-origin
      # /api/modules/{identity,catalog,conversation,execution,
      # evaluation,usage,audit,notification}; usage maps to usage-cost.
      PLATFORM_URL: http://platform-app:8080
      PLATFORM_GATEWAY_TOKEN: ${BROWSER_GATEWAY_TOKEN:?set independent BROWSER_GATEWAY_TOKEN}
      FRONTEND_AUTH_MODE: ${FRONTEND_AUTH_MODE:-demo}
      ACCESS_TOKEN_SIGNING_KEY: ${ACCESS_TOKEN_SIGNING_KEY:-}
      OIDC_PROXY_TRUSTED: ${OIDC_PROXY_TRUSTED:-false}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-}
      OIDC_PROXY_AUTH_URL: ${OIDC_PROXY_AUTH_URL:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_STEP_UP_CLIENT_ID: ${OIDC_STEP_UP_CLIENT_ID:-}
      OIDC_STEP_UP_CLIENT_SECRET: ${OIDC_STEP_UP_CLIENT_SECRET:-}
      OIDC_STEP_UP_REDIRECT_URL: ${OIDC_STEP_UP_REDIRECT_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ENV: ${APP_ENV:-development}
      DEPLOYMENT_PROFILE: modular-compose
      DEMO_PASSWORD_SYSTEM_ADMIN: ${DEMO_PASSWORD_SYSTEM_ADMIN:-}
    depends_on:
      platform-app:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-38080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Evaluation plugins run in an isolated sandbox.
  metric-runner:
    image: agentplug:metric-runner
    profiles: ["modular", "full", "sandbox"]
    build:
      context: .
      dockerfile: workers/metric-runner/Dockerfile
    environment:
      LEXAGENT_METRIC_SERVICE_ADDR: :8085
      LEXAGENT_METRIC_SERVICE_TOKEN: ${METRIC_RUNNER_TOKEN:-${INTERNAL_TOKEN:?set INTERNAL_TOKEN}}
      LEXAGENT_METRIC_NETWORK_MODE: none
      LEXAGENT_METRIC_REQUIRE_NONROOT: "true"
    networks:
      - metric-control
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/metric-service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Separate named volume: never mount the old MySQL data directory here.
  postgres:
    profiles: ["modular", "full"]
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set random DB_PASSWORD in private .env}
      POSTGRES_DB: agentplug
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    volumes:
      - modular-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Kafka is part of the default modular stack. MinIO remains full-only.
  # Kafka 随默认 modular 栈启动并自动恢复；MinIO 仍为 full 可选组件。
  kafka:
    profiles: ["modular", "full"]
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - modular-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40

  minio:
    profiles: ["full"]
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-entrypoint-guard.sh"]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${EVALUATION_ARTIFACT_S3_ACCESS_KEY:-lexagent-artifact}
      MINIO_ROOT_PASSWORD: ${EVALUATION_ARTIFACT_S3_SECRET_KEY:-}
    volumes:
      - modular-artifact-data:/data
      - ./scripts/minio-entrypoint-guard.sh:/usr/local/bin/minio-entrypoint-guard.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  notification-test-webhook:
    profiles: ["kafka-e2e"]
    image: python:3.12-alpine
    command: ["python", "/opt/notification_webhook_receiver.py", "--port", "8099"]
    ports:
      - "127.0.0.1:${NOTIFICATION_TEST_WEBHOOK_HOST_PORT:-18099}:8099"
    volumes:
      - ./tests/e2e/notification_webhook_receiver.py:/opt/notification_webhook_receiver.py:ro
      - ./tests/e2e/modular_notification_kafka_e2e.py:/opt/modular_notification_kafka_e2e.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 20

secrets:
  # Compose environment-backed secrets avoid putting credentials in YAML while
  # allowing production to replace them with a Secret Manager/Swarm/K8s mount.
  # 使用环境变量注入 Compose secret，生产环境可替换为 Secret Manager/K8s 挂载。
  internal_token:
    environment: INTERNAL_TOKEN
  internal_signing_secret:
    environment: INTERNAL_SIGNING_SECRET

volumes:
  modular-postgres-data:
  modular-artifact-data:
  modular-kafka-data:

networks:
  metric-control:
    internal: true
