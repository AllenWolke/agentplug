apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../external-postgres-example
# Each CIDR must be the approved fixed egress gateway or endpoint. This example
# remains blocked by production preflight until all placeholders are resolved.
patches:
  - target: {kind: NetworkPolicy, name: frontend-platform-traffic}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to: [{ipBlock: {cidr: REPLACE_WITH_APPROVED_IDP_GATEWAY_CIDR}}]
          ports: [{protocol: TCP, port: 443}]
  - target: {kind: NetworkPolicy, name: platform-app-traffic}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to: [{ipBlock: {cidr: REPLACE_WITH_APPROVED_MODEL_OTLP_GATEWAY_CIDR}}]
          ports: [{protocol: TCP, port: 443}]
  - target: {kind: NetworkPolicy, name: oauth2-proxy-traffic}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to: [{ipBlock: {cidr: REPLACE_WITH_APPROVED_IDP_GATEWAY_CIDR}}]
          ports: [{protocol: TCP, port: 443}]
