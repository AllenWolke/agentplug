apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../production
# Replace the CIDR with the approved fixed PostgreSQL egress gateway or endpoint.
# 将 CIDR 替换为已批准的固定 PostgreSQL 出站网关/端点；动态地址需使用受控 CNI 策略。
patches:
  - target: {kind: NetworkPolicy, name: platform-migration-traffic}
    patch: |-
      - op: replace
        path: /spec/egress/0/to
        value: [{ipBlock: {cidr: REPLACE_WITH_APPROVED_POSTGRES_CIDR}}]
  - target: {kind: NetworkPolicy, name: platform-app-traffic}
    patch: |-
      - op: replace
        path: /spec/egress/2/to
        value: [{ipBlock: {cidr: REPLACE_WITH_APPROVED_POSTGRES_CIDR}}]
