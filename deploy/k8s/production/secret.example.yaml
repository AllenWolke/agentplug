# Shape-only examples. Do not apply these placeholders; External Secrets,
# Vault, or the release secret manager must create the same Secret names.
# 仅用于说明结构，禁止直接应用占位值；必须由 External Secrets/Vault 或发布密钥系统创建。
apiVersion: v1
kind: Secret
metadata:
  name: lexagent-production-secret
  namespace: lexagent
type: Opaque
stringData:
  DB_DSN: replace-with-dml-only-managed-postgres-dsn
  INTERNAL_TOKEN: replace-with-cryptographically-random-secret
  BROWSER_GATEWAY_TOKEN: replace-with-independent-cryptographically-random-secret
  ACCESS_TOKEN_SIGNING_KEY: replace-with-base64url-of-at-least-32-random-bytes
  METRIC_RUNNER_TOKEN: replace-with-separate-cryptographically-random-secret
  INTERNAL_SIGNING_SECRET: replace-with-cryptographically-random-secret
  PLATFORM_CONTEXT_PRIVATE_KEY: replace-with-base64-ed25519-private-seed
  PLATFORM_CONTEXT_PUBLIC_KEY: replace-with-base64-ed25519-public-key
  KNOWLEDGE_DATABASE_DSN: replace-with-separate-postgres-runtime-dsn
---
apiVersion: v1
kind: Secret
metadata:
  name: lexagent-platform-migration-secret
  namespace: lexagent
type: Opaque
stringData:
  DB_DSN: replace-with-separate-migration-account-postgres-dsn
---
apiVersion: v1
kind: Secret
metadata:
  name: lexagent-agent-secret
  namespace: lexagent
type: Opaque
stringData:
  INTERNAL_TOKEN: replace-with-cryptographically-random-secret
  INTERNAL_SIGNING_SECRET: replace-with-cryptographically-random-secret
  CHECKPOINT_DSN: replace-with-agent-dml-only-postgres-workflow-dsn
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-context-public-key
  namespace: lexagent
type: Opaque
stringData:
  context-public.b64: replace-with-base64-ed25519-public-key
---
apiVersion: v1
kind: Secret
metadata:
  name: lexagent-model-provider-secrets
  namespace: lexagent
type: Opaque
stringData:
  provider.key: replace-with-model-provider-api-key
