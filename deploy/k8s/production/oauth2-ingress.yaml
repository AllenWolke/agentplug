apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lexagent-oauth2
spec:
  ingressClassName: nginx
  tls:
    - hosts: [agent.example.com]
      secretName: lexagent-tls
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend: {service: {name: oauth2-proxy, port: {name: http}}}
