# External Secrets/Vault must create this Secret in production. Never apply
# this placeholder directly; all values are deployment-specific credentials.
apiVersion: v1
kind: Secret
metadata:
  name: lexagent-oidc-secret
  namespace: lexagent
type: Opaque
stringData:
  client_id: replace
  client_secret: replace
  cookie_secret: replace-with-32-byte-base64url-value
  issuer_url: https://idp.example.com/realms/lexagent
  redirect_url: https://agent.example.com/oauth2/callback
  step_up_redirect_url: https://agent.example.com/auth/step-up/oidc/callback
