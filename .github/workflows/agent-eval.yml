name: agent-eval portability
on:
  workflow_dispatch:
  push:
    paths: ['cli/agent-eval/**', 'contracts/agent-evaluation/**', 'sdk/go/**', 'scripts/agent-eval-*', '.github/workflows/agent-eval.yml']
  pull_request:
    paths: ['cli/agent-eval/**', 'contracts/agent-evaluation/**', 'sdk/go/**', 'scripts/agent-eval-*', '.github/workflows/agent-eval.yml']
permissions:
  contents: read
jobs:
  cli:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: cli/agent-eval/go.sum
      - run: go test -race ./...
        working-directory: contracts/agent-evaluation/go
      - run: go test -race ./...
        working-directory: cli/agent-eval
      - run: go run ./cmd/agent-eval help
        working-directory: cli/agent-eval
