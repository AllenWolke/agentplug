name: supply-chain

on:
  pull_request:
  workflow_run:
    workflows: [agentplug-quality]
    types: [completed]

permissions:
  contents: read

jobs:
  sast-and-secrets:
    permissions:
      contents: read
      security-events: write
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
          # Keep the extraction cache independent of other workflow jobs.
          cache: false
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        if: matrix.language == 'go'
        with:
          python-version: '3.12'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Keep the default checks and include the Go quality suite reviewed locally.
          queries: ${{ matrix.language == 'go' && '+security-and-quality' || '' }}
      - name: Trace every active Go module
        if: matrix.language == 'go'
        env:
          CODEQL_EXTRACTOR_GO_BUILD_TRACING: 'on'
        run: |
          set -euo pipefail
          export GOCACHE="$RUNNER_TEMP/codeql-go-cache"
          for module in adapters/grpc-mapping adapters/legacy-http adapters/process adapters/sidecar agents/examples/go-eino cli/agent-eval cli/agentctl contracts/agent-evaluation/go contracts/code-runtime examples/go-operations frontend platform sdk/go templates/go-eino templates/go-generic workers/code-runtime workers/metric-runner; do
            # CodeQL's Go interceptor expects "build" as the first argument.
            # "go -C directory build" compiles but is skipped by the extractor.
            output="$RUNNER_TEMP/codeql-go/$module"
            mkdir -p "$output"
            (
              cd "$module"
              main_packages=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)
              if [[ -n "$main_packages" ]]; then
                go build -o "$output/" ./...
              else
                go build ./...
              fi
            )
          done
      - name: Trace Java SDK reactor and generated templates
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -f sdk/java/pom.xml clean test
          mvn --batch-mode --no-transfer-progress -f templates/java-generic/pom.xml clean test
          mvn --batch-mode --no-transfer-progress -f templates/java-spring-ai/pom.xml clean test
      - uses: github/codeql-action/analyze@v4
        id: codeql
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-raw
          # v4 explicitly supports SARIF post-processing with failure-only.
          # Analysis failures still fail this job and retain debugging uploads.
          upload: ${{ matrix.language == 'go' && 'failure-only' || 'always' }}
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify reviewed CodeQL exception negative controls
        if: matrix.language == 'go'
        run: python scripts/test_codeql_false_positives.py
      - name: Apply exact reviewed Go false positives to an upload copy
        if: matrix.language == 'go'
        run: |
          python scripts/filter_codeql_false_positives.py \
            --input "${{ steps.codeql.outputs.sarif-output }}/go.sarif" \
            --output "$RUNNER_TEMP/codeql-reviewed/go.sarif" \
            --summary "$RUNNER_TEMP/codeql-reviewed/review.json"
      - uses: github/codeql-action/upload-sarif@v4
        if: matrix.language == 'go'
        with:
          sarif_file: ${{ runner.temp }}/codeql-reviewed/go.sarif
          category: /language:go
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          wait-for-processing: true
      - name: Retain raw Go analysis and exact review receipt
        uses: actions/upload-artifact@v6
        if: always() && matrix.language == 'go'
        with:
          name: codeql-go-reviewed-results
          path: |
            ${{ runner.temp }}/codeql-raw/*.sarif
            ${{ runner.temp }}/codeql-reviewed/*.sarif
            ${{ runner.temp }}/codeql-reviewed/review.json
          retention-days: 90

  sbom-and-vulnerability:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: anchore/sbom-action@v0
        with: {path: ., format: cyclonedx-json, output-file: lexagent-sbom.cdx.json, upload-artifact: false}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-source.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lexagent-sbom
          path: |
            lexagent-sbom.cdx.json
            trivy-source.json
          retention-days: 90

  history-secret-scan:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify scanner exceptions and deleted-history detection
        run: python scripts/test_gitleaks_allowlists.py
      - name: Scan full fetched history without event-specific Action code
        run: |
          mkdir -p "$RUNNER_TEMP/history-scan"
          docker run --rm --network none --read-only --tmpfs /tmp \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/history-scan,target=/reports" \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --config=/repo/.gitleaks.toml --log-opts=--all --redact --no-banner --report-format=json --report-path=/reports/history.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: history-secret-scan
          path: ${{ runner.temp }}/history-scan/history.json
          retention-days: 14

  image-provenance:
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: [sast-and-secrets, sbom-and-vulnerability, history-secret-scan]
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: platform
            context: .
            dockerfile: platform/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: metric-runner
            context: .
            dockerfile: workers/metric-runner/Dockerfile
          - name: example-go
            context: .
            dockerfile: examples/go-operations/Dockerfile
          - name: example-python
            context: .
            dockerfile: examples/python-documents/Dockerfile
          - name: example-java
            context: .
            dockerfile: examples/java-tickets/Dockerfile
          - name: code-runtime
            context: .
            dockerfile: workers/code-runtime/Dockerfile
            # Required runtime base; this immutable Docker CLI index includes
            # Linux AMD64 and ARM64, matching the published image platforms.
            build-args: CODE_RUNTIME_DOCKER_CLI_IMAGE=docker.io/library/docker:29-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
          - name: agent-eval
            context: .
            dockerfile: cli/agent-eval/Dockerfile
          - name: local-embedding
            context: .
            dockerfile: providers/local-embedding/Dockerfile
          - name: code-sandbox-python
            context: .
            dockerfile: workers/code-runtime/images/Dockerfile
            target: python
          - name: code-sandbox-javascript
            context: .
            dockerfile: workers/code-runtime/images/Dockerfile
            target: javascript
          - name: code-sandbox-shell
            context: .
            dockerfile: workers/code-runtime/images/Dockerfile
            target: shell
          # Language scaffolds ship their own reviewed platform entry, so they
          # build and publish multi-arch exactly like the platform images.
          # 语言脚手架自带审核过的平台入口，因此与平台镜像一样按多架构构建与发布。
          - name: template-go-generic
            context: templates/go-generic
            dockerfile: templates/go-generic/Dockerfile
          - name: template-go-eino
            context: templates/go-eino
            dockerfile: templates/go-eino/Dockerfile
          - name: template-java-generic
            context: templates/java-generic
            dockerfile: templates/java-generic/Dockerfile
          - name: template-java-spring-ai
            context: templates/java-spring-ai
            dockerfile: templates/java-spring-ai/Dockerfile
          - name: template-python-generic
            context: templates/python-generic
            dockerfile: templates/python-generic/Dockerfile
          - name: template-python-langgraph
            context: templates/python-langgraph
            dockerfile: templates/python-langgraph/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: registry
        name: Normalize registry owner
        shell: bash
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: printf 'prefix=ghcr.io/%s\n' "${REGISTRY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: '${{ matrix.context }}'
          file: '${{ matrix.dockerfile }}'
          target: ${{ matrix.target || '' }}
          build-args: ${{ matrix.build-args || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.prefix }}/agentplug:${{ matrix.name }}-${{ github.event.workflow_run.head_sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.registry.outputs.prefix }}/agentplug@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: json
          output: trivy-image-amd64.json
          timeout: 15m
          trivy-config: .github/trivy-amd64.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan ARM64 image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.registry.outputs.prefix }}/agentplug@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: json
          output: trivy-image-arm64.json
          timeout: 15m
          trivy-config: .github/trivy-arm64.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.registry.outputs.prefix }}/agentplug@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes -a source_commit=${{ github.event.workflow_run.head_sha }} ${{ steps.registry.outputs.prefix }}/agentplug@${{ steps.build.outputs.digest }}
      - run: cosign attest --yes --type spdxjson --predicate image-sbom.spdx.json ${{ steps.registry.outputs.prefix }}/agentplug@${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: image-supply-chain-${{ matrix.name }}
          path: |
            trivy-image-*.json
            image-sbom.spdx.json
          retention-days: 30
