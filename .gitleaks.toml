# 仅允许已核对的公开夹具、占位值和标识符；新值及其他路径仍由默认规则扫描。
title = "AgentPlug reviewed public fixtures"
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "explicit test constant or request identifier; isolated/synthetic fixture, no issued account credential"
condition = "AND"
regexTarget = "secret"
paths = ["^cli/agentctl/internal/adaptergen/proxy_context_test\\.go$"]
regexes = ["^tok\\-signed\\-123$"]

[[rules.allowlists]]
description = "private-key placeholder rejected until replaced; not a base64 Ed25519 key"
condition = "AND"
regexTarget = "secret"
paths = ["^deploy/local/platform\\.env\\.example$"]
regexes = ["^replace\\-ed25519\\-private\\-key$"]

[[rules.allowlists]]
description = "documentation placeholder or authorization-result field misclassified as credential"
condition = "AND"
regexTarget = "secret"
paths = ["^docs/新增需求/模块化单体单实例改造/验收证据/MM\\-P\\-MM\\-Q\\-MM\\-V逐卡核对记录\\.md$"]
regexes = ["^permission_result=allowed$"]

[[rules.allowlists]]
description = "historical deterministic memory-encryption demonstration constant, never a production key"
condition = "AND"
regexTarget = "secret"
paths = ["^docs/智能体中台拆解文档/29、三项目六年级生产化改造实施与测试报告\\.md$"]
regexes = ["^0123456789abcdef0123456789abcdef$"]

