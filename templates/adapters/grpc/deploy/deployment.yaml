# Generated by agentctl from templates/adapters/grpc/profile.json.
# 由 agentctl 依据 grpc 模板资产生成：gRPC 容器隔离，仅暴露 invoke/health。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .AgentID }}-adapter
  labels: {app: {{ .AgentID }}-adapter, agent-adapter-kind: {{ .Kind }}, agent-adapter-isolation: {{ .Isolation }}}
spec:
  replicas: 2
  selector:
    matchLabels: {app: {{ .AgentID }}-adapter}
  template:
    metadata:
      labels: {app: {{ .AgentID }}-adapter, agent-adapter-kind: {{ .Kind }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: adapter
          image: {{ .Image }}
          ports: [{containerPort: {{ .Port }}, name: grpc}]
          env:
            - {name: ADAPTER_LISTEN_ADDR, value: ":{{ .Port }}"}
            - {name: AGENT_ENDPOINT_REF, value: "{{ .EndpointRef }}"}
            - {name: ADAPTER_TRANSPORT, value: "{{ .Transport }}"}
            - {name: PLATFORM_CONTEXT_PUBLIC_KEY_FILE, value: /var/run/secrets/agent-platform/context-public.b64}
          readinessProbe:
            httpGet: {path: /health/ready, port: {{ .Port }}}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/ready, port: {{ .Port }}}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: platform-context, mountPath: /var/run/secrets/agent-platform, readOnly: true}
      volumes:
        - name: platform-context
          secret: {secretName: agent-platform-context, defaultMode: 0444}
