# Generated by agentctl from templates/adapters/process/profile.json.
# 由 agentctl 依据 process 模板资产生成：仅 Platform 可入站调用；被启动的进程没有外部出站。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .AgentID }}-adapter
spec:
  podSelector:
    matchLabels: {app: {{ .AgentID }}-adapter}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: platform-app}}}]
      ports: [{protocol: TCP, port: {{ .Port }}}]
