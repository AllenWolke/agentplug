# Generated by agentctl from templates/adapters/process/profile.json.
# 由 agentctl 依据 process 模板资产生成：沙箱隔离。内存上限由容器 cgroup 承担，
# 必须严格等于 PROCESS_SANDBOX_MEMORY_BYTES，否则 Adapter 启动期核对失败并拒绝启动。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .AgentID }}-adapter
  labels: {app: {{ .AgentID }}-adapter, agent-adapter-kind: {{ .Kind }}, agent-adapter-isolation: {{ .Isolation }}}
spec:
  replicas: 2
  selector:
    matchLabels: {app: {{ .AgentID }}-adapter}
  template:
    metadata:
      labels: {app: {{ .AgentID }}-adapter, agent-adapter-kind: {{ .Kind }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: adapter
          image: {{ .Image }}
          ports: [{containerPort: {{ .Port }}, name: http}]
          env:
            - {name: ADAPTER_LISTEN_ADDR, value: ":{{ .Port }}"}
            - {name: AGENT_ENDPOINT_REF, value: "{{ .EndpointRef }}"}
            # PROCESS_COMMAND / PROCESS_ARGS_JSON / PROCESS_ENV_JSON must be
            # operator-registered; the process adapter never executes an
            # unregistered command supplied by a caller.
            # PROCESS_COMMAND 等必须由运维预注册，进程 Adapter 绝不执行调用方命令。
            - {name: PROCESS_SANDBOX_MEMORY_BYTES, value: "134217728"}
            - {name: PROCESS_SANDBOX_CPU_SECONDS, value: "30"}
            - {name: PROCESS_SANDBOX_MAX_PROCESSES, value: "64"}
            - {name: PROCESS_SANDBOX_MAX_OUTPUT_BYTES, value: "8388608"}
            - {name: PROCESS_SANDBOX_TIMEOUT_SECONDS, value: "120"}
            - {name: PROCESS_SANDBOX_NETWORK, value: "container"}
            - {name: PROCESS_SANDBOX_REQUIRE_CGROUP_MEMORY, value: "true"}
            - {name: PLATFORM_CONTEXT_PUBLIC_KEY_FILE, value: /var/run/secrets/agent-platform/context-public.b64}
          readinessProbe:
            httpGet: {path: /health/ready, port: {{ .Port }}}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/ready, port: {{ .Port }}}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: platform-context, mountPath: /var/run/secrets/agent-platform, readOnly: true}
      volumes:
        - name: platform-context
          secret: {secretName: agent-platform-context, defaultMode: 0444}
