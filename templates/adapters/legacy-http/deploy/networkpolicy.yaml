# Generated by agentctl from templates/adapters/legacy-http/profile.json.
# 由 agentctl 依据 legacy-http 模板资产生成：默认拒绝全部流量，仅放行已登记上游。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .AgentID }}-adapter
spec:
  podSelector:
    matchLabels: {app: {{ .AgentID }}-adapter}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: platform-app}}}]
      ports: [{protocol: TCP, port: {{ .Port }}}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 80}]
