# Generated by agentctl from templates/adapters/sidecar/profile.json.
# 由 agentctl 依据 sidecar 模板资产生成：侧车隔离。必须双向 TLS，客户端证书
# 与私钥只读挂载；缺少证书时 Adapter 启动失败闭合，绝不降级为明文上游。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .AgentID }}-adapter
  labels: {app: {{ .AgentID }}-adapter, agent-adapter-kind: {{ .Kind }}, agent-adapter-isolation: {{ .Isolation }}}
spec:
  replicas: 2
  selector:
    matchLabels: {app: {{ .AgentID }}-adapter}
  template:
    metadata:
      labels: {app: {{ .AgentID }}-adapter, agent-adapter-kind: {{ .Kind }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: adapter
          image: {{ .Image }}
          ports: [{containerPort: {{ .Port }}, name: http}]
          env:
            - {name: ADAPTER_LISTEN_ADDR, value: ":{{ .Port }}"}
            - {name: AGENT_ENDPOINT_REF, value: "{{ .EndpointRef }}"}
            - {name: SIDECAR_CLIENT_CERT_FILE, value: /var/run/secrets/adapter-mtls/tls.crt}
            - {name: SIDECAR_CLIENT_KEY_FILE, value: /var/run/secrets/adapter-mtls/tls.key}
            - {name: SIDECAR_SERVER_CA_FILE, value: /var/run/secrets/adapter-mtls/ca.crt}
            - {name: PLATFORM_CONTEXT_PUBLIC_KEY_FILE, value: /var/run/secrets/agent-platform/context-public.b64}
          readinessProbe:
            httpGet: {path: /health/ready, port: {{ .Port }}}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/ready, port: {{ .Port }}}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: adapter-mtls, mountPath: /var/run/secrets/adapter-mtls, readOnly: true}
            - {name: platform-context, mountPath: /var/run/secrets/agent-platform, readOnly: true}
      volumes:
        - name: adapter-mtls
          secret: {secretName: {{ .AgentID }}-adapter-mtls, defaultMode: 0400}
        - name: platform-context
          secret: {secretName: agent-platform-context, defaultMode: 0444}
