# The SDK ExecutionServer is the only HTTP surface; PORT drives it.
# / SDK ExecutionServer 是唯一 HTTP 接口面；由 PORT 驱动。
spring.main.web-application-type=none
# Model wiring: point base-url at any OpenAI-compatible endpoint (for example
# DeepSeek) and provide the key through the environment.
# / 模型接线：base-url 可指向任何 OpenAI 兼容端点（例如 DeepSeek），密钥经环境注入。
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
